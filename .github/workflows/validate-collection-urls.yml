name: Validate Collection URLs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  validate-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract and validate URLs
        run: |
          FAILED=0
          CHECKED=0
          FAILED_URLS=""
          CACHE_DIR="/tmp/kiwix-dir-cache"
          mkdir -p "$CACHE_DIR"

          probe_http() {
            local target_url="$1"
            local method="HEAD"
            local curl_exit=0
            local http_code

            http_code=$(curl -s -o /dev/null -w "%{http_code}" \
              --head \
              --connect-timeout 15 \
              --max-time 30 \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 3 \
              --location \
              "$target_url") || curl_exit=$?

            case "$http_code" in
              403|405|501)
                method="GET"
                curl_exit=0
                http_code=$(curl -s -o /dev/null -w "%{http_code}" \
                  --range 0-0 \
                  --max-filesize 8192 \
                  --connect-timeout 15 \
                  --max-time 30 \
                  --retry 3 \
                  --retry-all-errors \
                  --retry-delay 3 \
                  --location \
                  "$target_url") || curl_exit=$?
                ;;
            esac

            PROBE_CODE="$http_code"
            PROBE_METHOD="$method"
            PROBE_EXIT="$curl_exit"
            [ "$http_code" = "200" ] || [ "$http_code" = "206" ]
          }

          # Recursively extract all non-null string URLs from every JSON file in collections/
          URLS=$(jq -r '.. | .url? | select(type == "string")' collections/*.json | sort -u)

          while IFS= read -r url; do
            [ -z "$url" ] && continue
            CHECKED=$((CHECKED + 1))
            printf "Checking: %s ... " "$url"

            # download.kiwix.org redirects individual ZIM requests via MirrorBrain to random
            # community mirrors whose TLS handshakes frequently stall from CI runners.
            # Validate ZIM existence against the cached authoritative directory listing first.
            if [[ "$url" =~ ^https://download\.kiwix\.org/zim/([^/]+)/([^/]+\.zim)$ ]]; then
              SUBDIR="${BASH_REMATCH[1]}"
              ZIM_FILE="${BASH_REMATCH[2]}"
              DIR_URL="https://download.kiwix.org/zim/${SUBDIR}/"
              CACHE_FILE="${CACHE_DIR}/${SUBDIR//[^a-zA-Z0-9._-]/_}.html"

              if [ ! -s "$CACHE_FILE" ]; then
                curl -fsSL \
                  --connect-timeout 15 \
                  --max-time 30 \
                  --retry 3 \
                  --retry-all-errors \
                  --retry-delay 3 \
                  "$DIR_URL" -o "$CACHE_FILE" 2>/dev/null || rm -f "$CACHE_FILE"
              fi

              if [ -s "$CACHE_FILE" ]; then
                if grep -Fq "href=\"${ZIM_FILE}\"" "$CACHE_FILE"; then
                  echo "OK (indexed on download.kiwix.org/zim/${SUBDIR}/)"
                  continue
                else
                  echo "FAILED (404 — not listed in download.kiwix.org/zim/${SUBDIR}/)"
                  FAILED=$((FAILED + 1))
                  FAILED_URLS="$FAILED_URLS\n  - $url (missing from authoritative directory index)"
                  continue
                fi
              fi
            fi

            if probe_http "$url"; then
              echo "OK ($PROBE_CODE via $PROBE_METHOD)"
            else
              echo "FAILED (HTTP $PROBE_CODE via $PROBE_METHOD, curl exit $PROBE_EXIT)"
              FAILED=$((FAILED + 1))
              FAILED_URLS="$FAILED_URLS\n  - $url (HTTP $PROBE_CODE via $PROBE_METHOD, curl exit $PROBE_EXIT)"
            fi
          done <<< "$URLS"

          echo ""
          echo "Checked $CHECKED URLs, $FAILED failed."

          if [ "$FAILED" -gt 0 ]; then
            echo ""
            echo "Broken URLs:"
            printf "%b\n" "$FAILED_URLS"
            exit 1
          fi
